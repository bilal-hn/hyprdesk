# hyprdesk Minimalist Lock Screen
# Dynamic wallpaper blur, accent styling & clean typography

# Source dynamic colors from wallpaper (fallback safe)
source = ~/.cache/hyprdesk/hyprlock-colors.conf

# Fallbacks if cache doesn't exist
$accent ?= rgb(131, 211, 227)
$base ?= rgb(14, 21, 19)
$text ?= rgb(222, 228, 224)
$subtle ?= rgb(137, 147, 143)
$surface ?= rgba(14, 21, 19, 0.75)

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 2
    no_fade_in = false
    immediate_render = true
}

# Dynamic blurred background
background {
    monitor =
    path = ~/.cache/hyprdesk/current_wallpaper
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.75
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# Large Digital Clock (Hour : Minute)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%I:%M")"
    color = $text
    font_size = 90
    font_family = MesloLGS Nerd Font Bold
    position = 0, 130
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.4)
}

# Date Label
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = $accent
    font_size = 18
    font_family = MesloLGS Nerd Font Medium
    position = 0, 55
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.3)
}

# Password Input Field
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.25
    dots_center = true
    dots_rounding = -1
    outer_color = $accent
    inner_color = $surface
    font_color = $text
    fade_on_empty = false
    placeholder_text = <span foreground="##89938f">Enter Password...</span>
    hide_input = false
    rounding = 12
    check_color = $accent
    fail_color = rgb(255, 180, 171)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 200
    capslock_color = rgb(249, 226, 175)
    position = 0, -50
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.35)
}

# User / Host indicator
label {
    monitor =
    text = cmd[update:60000] echo "<b>$USER</b>@$(hostname)"
    color = $subtle
    font_size = 12
    font_family = MesloLGS Nerd Font
    position = 0, -110
    halign = center
    valign = center
}
