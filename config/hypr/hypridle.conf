# hyprdesk Idle Management Daemon
# Battery-aware screen dimming, locking & display power savings

general {
    lock_cmd = pidof hyprlock || hyprlock       # Avoid starting multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session    # Lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on  # Avoid needing to press a key twice to turn on display
}

# 1. Dim screen brightness after 2.5 minutes (150s)
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 20%
    on-resume = brightnessctl -r
}

# 2. Lock screen after 5 minutes (300s)
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 3. Turn off display (DPMS) after 5.5 minutes (330s)
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 4. Suspend system after 15 minutes (900s) of inactivity
listener {
    timeout = 900
    on-timeout = systemctl suspend
}
